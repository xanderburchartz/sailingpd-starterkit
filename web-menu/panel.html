<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SailingPD — Paneel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;background:#0e1420;color:#eaf0f8}
  #app{display:flex;flex-direction:column;height:100vh;width:100%;overflow:hidden;gap:0}
  .bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
  .idcol{display:flex;flex-direction:column;line-height:1.15;min-width:120px}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grp.tools{margin-left:auto}
  .iconbtn{padding:0;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn svg{width:18px;height:18px;display:block}
  .skinsel{text-transform:none;color:var(--ink);background:var(--input,var(--chrome));font-size:12px;padding:8px 10px;appearance:auto;-webkit-appearance:auto}
  .skinsel option{color:#111;background:#fff}
  .idcol .b{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--label)}
  .idcol .s{font-size:11px;font-weight:700;color:var(--label);opacity:.7;font-variant-numeric:tabular-nums}
  .btn{border:1px solid var(--line);background:transparent;color:var(--label);font:800 11px/1 inherit;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;border-radius:7px;cursor:pointer;min-height:34px}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stp{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:800;cursor:pointer;font-size:1rem}
  #grid{display:grid;gap:6px;grid-auto-rows:86px;align-content:start;flex:1;min-height:0;overflow:auto;padding:8px}
  #sheet{display:none;flex-direction:column;align-items:stretch;gap:.5rem;background:var(--chrome);border-top:1px solid var(--line);padding:.55rem .7rem;flex:none}
  .sheetrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .sheetrow.fields{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .sheetlbl{font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--label);flex:none}
  .sizectl{display:flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:800;color:var(--label);flex:none}
  .delbtn{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:7px;padding:.4rem .7rem;font-size:.72rem;font-weight:800;text-transform:uppercase;cursor:pointer;flex:none}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="idcol"><span class="b" id="boat">SailingPD</span><span class="s" id="status">--</span></div>
    <div class="grp">
      <select id="tplsel" data-sel="tpl" aria-label="Sjabloon" class="btn skinsel" title="Kies een dashboard-template">
        <option value="eigen">Eigen indeling</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Gevorderd</option>
        <option value="advanced">Expert</option>
      </select>
      <select id="skinsel" data-sel="skin" aria-label="Stijl" class="btn skinsel">
        <option value="spd">SPD-Default</option>
        <option value="modern">Modern</option>
        <option value="ray">Raymarine</option>
        <option value="bg">B&amp;G</option>
      </select>
    </div>
    <div class="grp tools">
      <button class="btn" id="addbtn" data-act="add" style="display:none">+ Tegel</button>
      <button class="btn" id="resetbtn" data-act="reset" style="display:none">Standaard</button>
      <button class="btn" id="editbtn" data-act="edit">Bewerken</button>
      <button class="btn iconbtn" id="night" data-act="night" title="Nachtmodus" aria-label="Nachtmodus"></button>
    </div>
    <span id="hint" style="font-size:11px;font-weight:700;color:var(--label);opacity:.8;flex-basis:100%"></span>
  </div>
  <div id="grid"></div>
  <div id="sheet"></div>
</div>

  // ── Tegel → HTML ──────────────────────────────────────────────────────────
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  // SPD-default: gedeelde tabel-rij (dunne grijze randen, label links / waarde rechts).
  function spdRow(bc,lc,ic,l,vt,u){ return '<tr>'
    + '<td style="border:1px solid '+bc+';padding:2px 6px;text-align:left;color:'+lc+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(l)+'</td>'
    + '<td style="border:1px solid '+bc+';padding:2px 6px;text-align:right;font-weight:800;color:'+ic+';font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(vt)+(u?' <span style="opacity:.55;font-weight:600">'+esc(u)+'</span>':'')+'</td>'
    + '</tr>'; }
  var SPDTABLE_COLS='<colgroup><col style="width:58%"><col style="width:42%"></colgroup>';
  // SPD-default: Google-Charts-achtige wijzerplaat (offline, in SVG nagemaakt) + evt. sub-uitlezing f2/f3/f4.
  function gaugeGoogle(t){
    var svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%" font-family="inherit">'
      + '<circle cx="50" cy="50" r="47" fill="'+t.gFaceFill+'" stroke="'+t.gFaceStroke+'" stroke-width="1"/>'
      + t.gRim + t.gTicks
      + '<g transform="'+t.needle+'"><line x1="50" y1="50" x2="50" y2="20" stroke="'+t.gNeedleCol+'" stroke-width="1.8" stroke-linecap="round"/></g>'
      + '<circle cx="50" cy="50" r="3.2" fill="'+t.gHubCol+'"/>'
      + '<text x="50" y="75" text-anchor="middle" font-size="13" font-weight="800" fill="'+t.gInk+'" font-family="inherit" style="font-variant-numeric:tabular-nums">'+esc(t.gValStr)+'</text>'
      + '</svg>';
    if(!(t.hf2||t.hf3||t.hf4)) return svg;
    var rows='';
    if(t.hf2) rows+=spdRow(t.tBorder,t.tLabel,t.tInk,t.l2,t.v2.t,t.u2);
    if(t.hf3) rows+=spdRow(t.tBorder,t.tLabel,t.tInk,t.l3,t.v3.t,t.u3);
    if(t.hf4) rows+=spdRow(t.tBorder,t.tLabel,t.tInk,t.l4,t.v4.t,t.u4);
    return '<div style="width:100%;height:100%;display:flex;flex-direction:column;min-height:0;gap:3px">'
      + '<div style="flex:1;min-height:0;display:grid;place-items:center">'+svg+'</div>'
      + '<table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(9px,2.6vmin,12px);font-family:inherit">'+SPDTABLE_COLS+rows+'</table></div>';
  }
  // SPD-default: ruwe SPD-datatabel voor getal-/tekst-tegels.
  function spdTable(t){
    var rows = spdRow(t.tBorder,t.tLabel,t.tInk, t.l1, t.isText?t.text:t.val.t, t.isText?'':t.u1);
    if(t.hf2) rows+=spdRow(t.tBorder,t.tLabel,t.tInk,t.l2,t.v2.t,t.u2);
    if(t.hf3) rows+=spdRow(t.tBorder,t.tLabel,t.tInk,t.l3,t.v3.t,t.u3);

    return '<table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:clamp(11px,3.4vmin,15px);font-family:inherit">'+SPDTABLE_COLS+rows+'</table>';
  }
  // Modern skin: wind/koers-meter met 4 hoekwaarden (zoals de rozen), in de neutrale look.
  function modernCornersHTML(t){
    var c=function(pos,l,v,u,al){ return '<div style="position:absolute;'+pos+';max-width:47%;pointer-events:none">'
      + '<div style="font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:'+al+'">'+esc(l)+'</div>'
      + '<div style="font-size:clamp(15px,4.6vmin,23px);font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:'+al+'">'+esc(v)+(u?'<span style="font-size:.6em;color:var(--label)"> '+esc(u)+'</span>':'')+'</div></div>'; };
    return c('top:4px;left:7px', t.l1, t.v1.i+t.v1.d, t.u1, 'left')

  function modernMeter(t){ return '<div style="position:absolute;inset:16% 20%">'+TPL.gaugeModern(t)+'</div>'+modernCornersHTML(t); }
  // Modern skin: sub-regel(s) met f2/f3/f4 onder een getal/gen-meter (doel-vs-werkelijk).
  function modernSubHTML(t){
    var line=function(l,v,u){ return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:clamp(11px,3vmin,14px);line-height:1.35">'

  // Tekst-tegel (trimadvies, wind-/stroom-boodschap) als coaching-blok: wrapt, stapelt f + f2/f3/f4.
  function textStack(t){

    push(t.textHtml); if(t.hf2) push(t.v2.t); if(t.hf3) push(t.v3.t); if(t.hf4) push(t.v4.t);
    if(!lines.length) lines.push('—');
    var multi=lines.length>1;
    var body=lines.map(function(h,i){
      return '<div style="display:flex;gap:8px;align-items:flex-start'+(i>0?';border-top:1px solid var(--line);padding-top:7px;margin-top:7px':'')+'">'
        + (multi?'<span style="flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:2px">'+(i+1)+'</span>':'')

  }
  function tileInner(t){
    if(t.isText) return textStack(t);
    if(t.isModernMeter) return modernMeter(t);
    if(t.modernSub) return modernWithSub(t);
    if(t.isGaugeGoogle) return gaugeGoogle(t);

  }
  function tileHTML(t){
    return '<div style="'+t.styleStr+'" data-tile="'+t.idx+'" data-act="tile">'
      + (t.showHead?'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--label)"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.label)+'">'+esc(t.label)+'</span><span style="flex:none;opacity:.8">'+esc(t.unit)+'</span></div>':'')

  // ── Render ────────────────────────────────────────────────────────────────

      var bw='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>';

  // ── Bewerk-sheet ──────────────────────────────────────────────────────────
  function fieldSelect(id,val){ var h='<select data-sel="'+id+'" style="background:var(--input,var(--chrome));color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:.4rem;font-size:.82rem;font-weight:600;max-width:44vw">';
    if(id!=='field') h+='<option value=""'+(val?'':' selected')+'>— geen —</option>';
    GROUPS().forEach(function(g){ h+='<optgroup label="'+g[0]+'">'; g[1].forEach(function(k){ h+='<option value="'+k+'"'+(k===val?' selected':'')+'>'+k+'</option>'; }); h+='</optgroup>'; }); return h+'</select>'; }
  function seg(items){ var h='<div style="display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden">'; items.forEach(function(it){ h+='<div data-act="'+it.a+'" style="padding:.42rem .7rem;font-size:.72rem;font-weight:800;text-transform:uppercase;color:'+(it.on?'#fff':'var(--label)')+';background:'+(it.on?'var(--accent)':'transparent')+';cursor:pointer">'+it.t+'</div>'; }); return h+'</div>'; }
  function renderSheet(pal){
    var sh=document.getElementById('sheet');

    var c=state.tiles[state.sel];
    // De bewerk-balk hangt ALLEEN af van de geselecteerde tegel + z'n config, niet van live data.
    // Alleen herbouwen als die signatuur wijzigt — anders wordt een knop/dropdown midden in een
    // klik vervangen (bij elke datapush, ook via de WebSocket) en registreert de klik niet

  // ── Acties ────────────────────────────────────────────────────────────────
  // Minimale tegelgrootte: tekst/advies-tegels niet onder 2×2 (anders onleesbaar).
  function tileMin(c){ var F=FIELDS(); return (c&&F[c.f]&&F[c.f].text)?{w:2,h:2}:{w:1,h:1}; }
  function upd(patch){ var t=state.tiles.slice(); t[state.sel]=Object.assign({},t[state.sel],patch); setTiles(t); }
  var ACT={
    'skin-modern':function(){ put('spd-skin-v2','modern'); state.skin='modern'; render(); },
    'skin-bg':function(){ put('spd-skin-v2','bg'); state.skin='bg'; render(); },
    'skin-ray':function(){ put('spd-skin-v2','ray'); state.skin='ray'; render(); },
    'skin-spd':function(){ put('spd-skin-v2','spd'); state.skin='spd'; render(); },
    night:function(){ var order=['day','bw','night']; state.mode=order[(order.indexOf(state.mode)+1)%3]; put('spd-mode-v1',state.mode); render(); },

    mGen:function(){ upd({m:'gen'}); },

    mCrs:function(){ var c=state.tiles[state.sel],F=FIELDS(); upd({m:'crs',f:(F[c.f]&&!F[c.f].text)?c.f:'HDG-corrected',f2:c.f2||'STW-corrected',f3:c.f3||'GEOWIND',f4:c.f4||'Depth-avg',w:Math.max(3,c.w||1),h:Math.max(4,c.h||1)}); },

    if(ACT[a]) ACT[a]();

  document.addEventListener('change',function(e){
    var s=e.target.closest('[data-sel]'); if(!s) return;
    var which=s.getAttribute('data-sel'), v=s.value, F=FIELDS();
    if(which==='skin'){ if(['modern','bg','ray','spd'].indexOf(v)<0) v='modern'; put('spd-skin-v2',v); state.skin=v; render(); return; }
    if(which==='tpl'){ if(TEMPLATES[v]) setTiles(cloneTiles(TEMPLATES[v]),{sel:null,tpl:v}); else setTpl('eigen'); return; }
    if(state.sel==null) return;
    if(which==='field') upd({f:v, t:(F[v]&&F[v].text)?'num':state.tiles[state.sel].t});
    else if(which==='field2') upd({f2:v||undefined}); else if(which==='field3') upd({f3:v||undefined}); else if(which==='field4') upd({f4:v||undefined});
  });

  // Drag (verplaatsen) + resize (grip)
  var drag=null;
  document.addEventListener('pointerdown',function(e){
    if(!state.editing) return;
    var grip=e.target.closest('[data-grip]');
    if(grip){ e.preventDefault(); e.stopPropagation();
      var idx=parseInt(grip.getAttribute('data-grip'),10), c0=state.tiles[idx];
      // celmaat uit de tegel zelf: breedte/hoogte gedeeld door huidige w/h
      var host=grip.closest('[data-tile]'), r=host.getBoundingClientRect();
      var cw=Math.max(1,r.width/Math.max(1,c0.w||1)), ch=Math.max(1,r.height/Math.max(1,c0.h||1));
      var start={x:e.clientX,y:e.clientY,w:c0.w||1,h:c0.h||1};
      gesture=true; state.sel=idx; render();
      var mv=function(ev){ if(!state.editing){ cleanup(); return; }
        var dw=Math.round((ev.clientX-start.x)/cw), dh=Math.round((ev.clientY-start.y)/ch);
        var mn=tileMin(c0); var t=state.tiles.slice(); t[idx]=Object.assign({},t[idx],{w:Math.max(mn.w,Math.min(state.cols,start.w+dw)),h:Math.max(mn.h,Math.min(6,start.h+dh))}); state.tiles=t; render(); };
      var cleanup=function(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); gesture=false; };
      var up=function(){ cleanup(); persistTiles(); };
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up); return;
    }
    var host2=e.target.closest('[data-tile]'); if(!host2) return;
    drag={from:parseInt(host2.getAttribute('data-tile'),10)}; gesture=true;
    var mv=function(ev){ if(!drag||!state.editing){ cleanup(); return; } var el=document.elementFromPoint(ev.clientX,ev.clientY);
      var h=el&&el.closest?el.closest('[data-tile]'):null; if(!h) return;
      var to=parseInt(h.getAttribute('data-tile'),10); if(isNaN(to)||to===drag.from) return;
      var t=state.tiles.slice(), moved=t.splice(drag.from,1)[0]; t.splice(to,0,moved); drag.from=to; state.sel=to; state.tiles=t; render(); };
    var cleanup=function(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); drag=null; gesture=false; };
    var up=function(){ cleanup(); persistTiles(); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });

  // ── WebSocket + demo ──────────────────────────────────────────────────────
  function connect(){ if(!location.hostname) return; var host=location.hostname, port=location.port||'9090', ws;
    try{ ws=new WebSocket('ws://'+host+':'+port+'/ws'); }catch(e){ setTimeout(connect,4000); return; }
    ws.onmessage=function(ev){ try{ state.data=JSON.parse(ev.data); state.live=true; state.lastMsg=Date.now(); render(); }catch(e){} };
    ws.onclose=function(){ state.live=false; setTimeout(connect,4000); };
    ws.onerror=function(){ try{ws.close();}catch(e){} }; }
  var sim={t:0,twdRef:67,adv:0};
  function tick(){ if(gesture) return; ticking=true;
    if(state.live && (Date.now()-(state.lastMsg||0))>5000) state.live=false; // bevroren feed → val terug op demo
    if(state.live){ render(); ticking=false; return; }
    var s=sim; s.t+=0.2; var t=s.t, sin=Math.sin;
    var tws=9.6+1.5*sin(t/17)+0.4*sin(t/3.1), twd=67+9*sin(t/23)+2.5*sin(t/6.5), ua=42-0.35*(tws-9.6);
    var wob=9*sin(t/11)+3*sin(t/4.1), hdg=twd-ua+wob, twa=-(ua+wob), tgt=6.35+0.16*(tws-9.6), stw=tgt*(0.955+0.045*sin(t/9.1)), heel=20.5+2.4*sin(t/5.7);
    var advs=['low heel less twist, slack forestay','meer voorlijkspanning, traveller iets naar lij','iets meer twist, backstay losser'];
    if(t%24<0.2) s.adv=(s.adv+1)%3;
    state.data={ 'Boatname':'Penny Lane','GPS-RMC-time':new Date().toTimeString().slice(0,8),
      'SOG':stw+0.35,'STW-corrected':stw,'TWS':tws,'TWS-avg':9.5,'TWS-trend':0.9*sin(t/17+1.57),
      'TWA':twa,'AWA':twa*0.62,'AWS':tws*1.35,'GEOWIND':twd,'HDG-corrected':(hdg+360)%360,'COG':(hdg+4.5+360)%360,
      'Windshift-deg':twd-s.twdRef,'Upwind-angle':ua,'Downwind-angle':150,'UA-error':twa<0?(-twa-ua):(twa-ua),'DA-error':0,
      'Target-speed':tgt,'Target-VMG':tgt*Math.cos(ua*Math.PI/180)*1.02,'VMG':stw*Math.cos(ua*Math.PI/180),
      'Performance-SOG':stw/tgt*100,'Performance-waterspeed':stw/tgt*100-0.7,'Performance-to-windward':stw/tgt*100-1.8,
      'Best-heel':18,'Actual-heel':heel,'Heel-error':heel-18,'Actual-pitch':1.7,'Actual-leeway':-4+0.6*sin(t/8),
      'Current-kts':0.4,'Current-to-degrees':210,'Current-impact-degrees':8,'Depth-avg':6.2+0.4*sin(t/11),'Depth-change':0.1,
      'Trim-advice1':advs[s.adv],'Trim-advice2':'','Trim-advice3':'' };
    render(); ticking=false;
  }
  function onResize(){ var c=Math.max(2,Math.min(10,Math.floor(window.innerWidth/135))); if(c!==state.cols){ state.cols=c; render(); } }
  window.addEventListener('resize',onResize); onResize();
  connect(); setInterval(tick,200); render();
})();

</script>
</body>
