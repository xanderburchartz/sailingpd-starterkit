<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SailingPD — Legacy</title>
<style>
  * { margin:0; padding:0; -webkit-box-sizing:border-box; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#e9edf1; color:#14171c;
    font-family:Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; }
  .bar { background:#1f2b3a; color:#fff; padding:8px 12px; }
  .bar .b { font-size:16px; font-weight:bold; letter-spacing:.06em; }
  .bar .s { font-size:12px; color:#9fb0c4; }
  .grid { display:-webkit-box; display:-webkit-flex; display:flex;
    -webkit-flex-wrap:wrap; flex-wrap:wrap;
    -webkit-align-items:flex-start; align-items:flex-start; padding:5px; }
  .tile { background:#fff; border:1px solid #ccd2da;
    -webkit-flex:1 1 14%; flex:1 1 14%; margin:4px; min-height:82px;
    padding:6px 9px; position:relative; overflow:hidden; }
  .tile.half { -webkit-flex-basis:22.5%; flex-basis:22.5%; }
  .tile.wide { -webkit-flex-basis:98%; flex-basis:98%; border-left:6px solid #1f5fd0; }
  .tile.tall { min-height:172px; }
  .lbl { font-size:12px; font-weight:bold; text-transform:uppercase;
    color:#3a4658; letter-spacing:.04em; }
  .val { font-size:33px; font-weight:bold; line-height:1.03; margin-top:1px; }
  .unit { font-size:15px; color:#3a4658; font-weight:normal; }
  .sub { margin-top:5px; padding-top:5px; border-top:1px solid #e3e6ea; font-size:14px; color:#3a4658; }
  .sub b { font-size:18px; color:#14171c; }
  .advice { font-size:22px; font-weight:bold; line-height:1.32; margin-top:4px; }
  .advice.empty { font-size:16px; font-weight:normal; font-style:italic; color:#8a94a2; }
  .advice .n { display:inline-block; width:21px; height:21px; line-height:21px; text-align:center;
    background:#1f5fd0; color:#fff; border-radius:11px; font-size:12px; margin-right:7px; }
  .gwrap { text-align:center; }
  svg { display:block; width:100%; height:168px; }
  .gval { font-size:34px; font-weight:bold; margin-top:-38px; }
</style>
</head>
<body>
<div class="bar"><span class="b" id="boat">SailingPD</span> &nbsp;&middot;&nbsp; <span class="s" id="status">verbinden&hellip;</span></div>
<div class="grid" id="grid"></div>

<script>
/* ES5-only, geen container queries / clamp / arrow functions — werkt op oude Safari (iPad 2). */
var DATA = {}, LIVE = false, LAST = 0;

var TILES = [
  { k:'text', f:'Trim-advice1', l:'Trimadvies & boodschappen', cls:'wide',
    extra:['Trim-advice2','Trim-advice3','Wind-message','Current-message'],
    empty:'Nog geen advies — verschijnt zodra je vaart' },
  { k:'gauge', f:'Performance-waterspeed', l:'Performance (STW)', u:'%', min:60, max:115, zone:'up', cls:'half tall' },
  { k:'gauge', f:'Performance-to-windward', l:'Perf. te loevaart', u:'%', min:60, max:115, zone:'up', cls:'half tall' },
  { k:'pair', f:'STW-corrected', l:'Snelheid (STW)', u:'kn', d:1, f2:'Target-speed', l2:'doel' },
  { k:'pair', f:'VMG', l:'VMG', u:'kn', d:1, f2:'Target-VMG', l2:'doel' },
  { k:'pair', f:'Actual-heel', l:'Slagzij', u:'°', d:0, abs:true, f2:'Best-heel', l2:'doel' },
  { k:'num', f:'SOG', l:'SOG', u:'kn', d:1 },
  { k:'hdg', f:'HDG-corrected', l:'Koers', u:'°' },
  { k:'hdg', f:'COG', l:'COG', u:'°' },
  { k:'num', f:'Depth-avg', l:'Diepte', u:'m', d:1 },
  { k:'num', f:'AWA', l:'AWA', u:'°', d:0, abs:true },
  { k:'num', f:'TWA', l:'TWA', u:'°', d:0, abs:true },
  { k:'num', f:'AWS', l:'AWS', u:'kn', d:1 },
  { k:'num', f:'TWS', l:'TWS', u:'kn', d:1 },
  { k:'hdg', f:'GEOWIND', l:'Ware wind', u:'°' },
  { k:'num', f:'Actual-leeway', l:'Drift (leeway)', u:'°', d:0 },
  { k:'num', f:'Upwind-angle', l:'Doelhoek op', u:'°', d:0 },
  { k:'num', f:'Rate-of-Turn', l:'Draaisnelheid', u:'°/s', d:0 }
];

function numOf(x){ var y = parseFloat(x); return isNaN(y) ? null : y; }
function fmt(v, dec){ if (v == null) return '--'; return (v < 0 ? '-' : '') + Math.abs(v).toFixed(dec); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function isPerf(k){ return /^Performance-(SOG|waterspeed|incl-current|to-)/.test(k); }
function perfVal(f){ var p = numOf(DATA[f]), s = numOf(DATA['SOG']);
  if (p == null || p > 150 || (s != null && s < 0.4)) return null; return p; }

function polar(cx, cy, r, a){ var rad = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; }
function arc(cx, cy, r, a0, a1){
  var p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1), big = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return 'M' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
}
function gaugeSVG(val, min, max, zone){
  var frac = (val == null) ? 0 : Math.max(0, Math.min(1, (val - min) / (max - min)));
  function A(fr){ return -135 + 270 * fr; }
  var bands = zone === 'up'   ? [[0,.33,'#d0342b'],[.33,.66,'#e0982a'],[.66,1,'#189a4b']]
            : zone === 'down' ? [[0,.33,'#189a4b'],[.33,.66,'#e0982a'],[.66,1,'#d0342b']]
            : [[0,1,'#c6ccd4']];
  var rim = '', i;
  for (i = 0; i < bands.length; i++){
    rim += '<path d="' + arc(50, 50, 40, A(bands[i][0]), A(bands[i][1])) + '" fill="none" stroke="' + bands[i][2] + '" stroke-width="8"/>';
  }
  var ticks = '', mk;
  for (i = 0; i <= 4; i++){ var pn = polar(50, 50, 30, A(i / 4)); var t0 = polar(50, 50, 45, A(i / 4)), t1 = polar(50, 50, 51, A(i / 4));
    var lv = Math.round(min + (max - min) * i / 4);
    ticks += '<line x1="' + t0[0].toFixed(1) + '" y1="' + t0[1].toFixed(1) + '" x2="' + t1[0].toFixed(1) + '" y2="' + t1[1].toFixed(1) + '" stroke="#9aa3af" stroke-width="1"/>';
    ticks += '<text x="' + pn[0].toFixed(1) + '" y="' + (pn[1] + 2).toFixed(1) + '" text-anchor="middle" font-size="7" fill="#5a6472">' + lv + '</text>';
  }
  var needle = 'rotate(' + (-135 + 270 * frac).toFixed(1) + ' 50 50)';
  return '<svg viewBox="0 0 100 78" preserveAspectRatio="xMidYMid meet">' +
    rim + ticks +
    '<line x1="50" y1="50" x2="50" y2="18" stroke="#14171c" stroke-width="2.4" transform="' + needle + '"/>' +
    '<circle cx="50" cy="50" r="3.4" fill="#14171c"/></svg>';
}

function tileHTML(t){
  var cls = 'tile' + (t.cls ? ' ' + t.cls : '');
  var head = '<div class="lbl">' + esc(t.l) + '</div>';
  if (t.k === 'gauge'){
    var pv = isPerf(t.f) ? perfVal(t.f) : numOf(DATA[t.f]);
    var vt = (pv == null) ? '--' : fmt(pv, 0);
    return '<div class="' + cls + '"><div class="lbl">' + esc(t.l) + ' &middot; ' + t.u + '</div>' +
      '<div class="gwrap">' + gaugeSVG(pv, t.min, t.max, t.zone) +
      '<div class="gval">' + vt + '</div></div></div>';
  }
  if (t.k === 'text'){
    var lines = [], v1 = DATA[t.f];
    if (v1 != null && String(v1).replace(/\s/g,'') !== '') lines.push(String(v1));
    if (t.extra){ for (var j = 0; j < t.extra.length; j++){ var e = DATA[t.extra[j]];
      if (e != null && String(e).replace(/\s/g,'') !== '') lines.push(String(e)); } }
    var body, m;
    if (!lines.length){
      body = '<div class="advice empty">' + esc(t.empty || '—') + '</div>';
    } else {
      body = '';
      for (m = 0; m < lines.length; m++){
        body += '<div class="advice">' + (lines.length > 1 ? '<span class="n">' + (m + 1) + '</span>' : '') + esc(lines[m]) + '</div>';
      }
    }
    return '<div class="' + cls + '">' + head + body + '</div>';
  }
  // num / pair / hdg
  var raw = DATA[t.f], v = numOf(raw), disp;
  if (t.k === 'hdg'){ disp = (v == null) ? '--' : ('00' + ((Math.round(v) % 360 + 360) % 360)).slice(-3); }
  else if (isPerf(t.f)){ var pp = perfVal(t.f); disp = (pp == null) ? '--' : fmt(pp, 0); }
  else { disp = fmt(t.abs && v != null ? Math.abs(v) : v, t.d == null ? 1 : t.d); }
  var sub = '';
  if (t.k === 'pair' && t.f2){ var v2 = numOf(DATA[t.f2]); sub = '<div class="sub">' + esc(t.l2) + ' <b>' + fmt(v2, t.d == null ? 1 : t.d) + '</b> ' + t.u + '</div>'; }
  return '<div class="' + cls + '">' + head +
    '<div class="val">' + disp + '<span class="unit"> ' + t.u + '</span></div>' + sub + '</div>';
}

function render(){
  document.getElementById('boat').innerHTML = DATA['Boatname'] ? esc(String(DATA['Boatname'])) : 'SailingPD';
  var stale = LIVE && (+new Date() - LAST) > 5000;
  document.getElementById('status').innerHTML = (LIVE && !stale ? 'LIVE' : 'geen data') +
    ' &middot; ' + (DATA['GPS-RMC-time'] ? esc(String(DATA['GPS-RMC-time'])) : '--:--:--');
  var html = '', i;
  for (i = 0; i < TILES.length; i++){ html += tileHTML(TILES[i]); }
  document.getElementById('grid').innerHTML = html;
}

function connect(){
  if (!location.hostname){ return; } // file:// -> alleen demo
  var ws;
  try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
  catch (e){ setTimeout(connect, 4000); return; }
  ws.onmessage = function(ev){ try { DATA = JSON.parse(ev.data); LIVE = true; LAST = +new Date(); } catch (e){} };
  ws.onclose = function(){ LIVE = false; setTimeout(connect, 4000); };
  ws.onerror = function(){ try { ws.close(); } catch (e){} };
}

// demo als er geen live data is (zodat de pagina ook zonder feed iets toont)
var sim = 0;
function demo(){
  if (LIVE) return;
  sim += 0.2; var t = sim, sin = Math.sin;
  var tws = 9.6 + 1.5 * sin(t / 17), tgt = 6.35 + 0.16 * (tws - 9.6), stw = tgt * (0.955 + 0.045 * sin(t / 9));
  DATA = { 'Boatname':'Penny Lane', 'GPS-RMC-time':'demo',
    'SOG': stw + 0.3, 'STW-corrected': stw, 'Target-speed': tgt, 'TWS': tws, 'TWA': -42,
    'AWA': -26, 'AWS': tws * 1.35, 'HDG-corrected': (72 + 6 * sin(t / 11) + 360) % 360,
    'COG': (76 + 6 * sin(t / 11) + 360) % 360, 'GEOWIND': (135 + 4 * sin(t / 23) + 360) % 360,
    'Depth-avg': 6.2 + 0.4 * sin(t / 11), 'Depth-change': 0.1, 'Actual-heel': 20 + 2 * sin(t / 6), 'Best-heel': 18,
    'Actual-leeway': -4 + 0.6 * sin(t / 8), 'Upwind-angle': 42, 'Rate-of-Turn': 2 * sin(t / 4),
    'VMG': stw * 0.72, 'Target-VMG': tgt * 0.74,
    'Performance-waterspeed': stw / tgt * 100, 'Performance-to-windward': stw / tgt * 100 - 1.5,
    'Trim-advice1': 'Minder heel, minder twist', 'Trim-advice2':'Traveller iets naar lij',
    'Wind-message':'Lift — stuur 3° hoger', 'Current-message':'Stroom zet je 0,4 kn naar lij' };
}

connect();
setInterval(function(){ demo(); render(); }, 1000);
render();
</script>
</body>
</html>
