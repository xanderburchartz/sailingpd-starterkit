/* Basisstijl voor de pagina (stond voorheen als losse body-rule naast de Tailwind CDN) */
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; color: #0f172a; line-height: 1.5; }

  /* ── Custom UI Component Styles ─────────────────────────────────────── */
  .step-circle { width:2rem; height:2rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; flex-shrink:0; }
  .step-done   { background:#10b981; color:#fff; }
  .step-active { background:#2563eb; color:#fff; }
  .step-todo   { background:#cbd5e1; color:#64748b; }
  .why-box { background:#eff6ff; border-left:4px solid #3b82f6; }
  .field-group { margin-bottom:1.25rem; }
  .field-label { font-size:.875rem; font-weight:600; color:#374151; margin-bottom:.35rem; display:block; }
  .field-hint  { font-size:.75rem; color:#6b7280; margin-top:.25rem; }
  .form-input  { width:100%; border:1px solid #d1d5db; border-radius:.5rem; padding:.5rem .75rem; font-size:.9rem; outline:none; transition:border-color .15s; }
  .form-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  select.form-input { background:#fff; }
  .toggle-row  { display:flex; align-items:center; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid #f1f5f9; }
  .toggle-row:last-child { border-bottom:none; }
  .toggle-label { font-size:.875rem; color:#374151; }
  .toggle-hint  { font-size:.75rem; color:#6b7280; }
  input[type=checkbox] { width:1.1rem; height:1.1rem; accent-color:#2563eb; cursor:pointer; }
  .badge { display:inline-block; padding:.15rem .5rem; border-radius:.25rem; font-size:.7rem; font-weight:700; }
  .badge-opt  { background:#fef3c7; color:#92400e; }
  .badge-req  { background:#fee2e2; color:#991b1b; }
  .csv-preview { font-family:monospace; font-size:.72rem; background:#1e293b; color:#e2e8f0; border-radius:.5rem; padding:1rem; overflow:auto; max-height:250px; white-space:pre; }
  .nav-step { display:flex; align-items:center; gap:.6rem; padding:.55rem .75rem; border-radius:.5rem; cursor:pointer; transition:background .15s; }

</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- ── Header ───────────────────────────────────────────────────────── -->
<header class="bg-slate-900 text-white px-6 py-4 flex items-center gap-4 shadow-lg">
  <img src="/api/image/icon" alt="SPD" class="w-7 h-7 object-contain flex-shrink-0" style="filter:invert(1)" onerror="this.style.display='none'">
  <div>
    <h1 class="text-xl font-bold tracking-wide">SailingPD Config Wizard</h1>
    <p class="text-slate-400 text-xs" id="hdr-dir">Installatiemap laden…</p>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <span id="config-badge" class="hidden badge badge-opt">Bestaande config geladen</span>
    <button onclick="openGlossary()" title="Uitleg van zeil- en techniektermen"
      class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-semibold text-sm transition">
      📖 Woordenlijst
    </button>
    <button onclick="saveAll()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold text-sm transition">
      💾 Alles opslaan
    </button>
  </div>
</header>

<div class="flex min-h-[calc(100vh-68px)]">

<!-- ── Sidebar ──────────────────────────────────────────────────────── -->
<aside class="w-64 bg-white border-r border-slate-200 py-6 px-3 flex-shrink-0">
  <p class="text-xs uppercase font-semibold text-slate-400 px-2 mb-3">Configuratiestappen</p>
  <nav id="step-nav" class="space-y-1"></nav>
</aside>

<!-- ── Main content ─────────────────────────────────────────────────── -->
<main class="flex-1 p-4 sm:p-8 overflow-y-auto">
  <div id="loading" class="flex items-center justify-center h-64">
    <div class="text-center text-slate-500">
      <div class="text-4xl mb-3">⚓</div>
      <p class="text-lg font-medium">Configuratie laden…</p>
    </div>

  </div>
  <!-- navigation buttons -->

      ← Vorige
    </button>
    <div class="flex gap-3">
      <button id="btn-next" onclick="nextStep()"
        class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition">
        Volgende →
      </button>
      <button id="btn-save" onclick="saveAndStart()" class="hidden px-6 py-2.5 rounded-lg bg-green-600 hover:bg-green-500 text-white font-semibold text-sm transition shadow">

</div>

<!-- ── Flash message ─────────────────────────────────────────────────── -->
<div id="flash" class="save-flash hidden"></div>

<!-- ── Woordenlijst (glossary) modal ─────────────────────────────────── -->
<div id="glossary" class="hidden fixed inset-0 z-[1000] bg-black/50 flex items-start justify-center p-4 overflow-y-auto" onclick="if(event.target===this)closeGlossary()">
  <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full my-8">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 sticky top-0 bg-white rounded-t-2xl">
      <h2 class="text-lg font-bold text-slate-800">📖 Woordenlijst — in gewone taal</h2>
      <button onclick="closeGlossary()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
    </div>
    <div id="glossary-body" class="px-6 py-5 space-y-3"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let cfg = {};
let currentStep = 0;
const TOTAL_STEPS = 14;
const completedSteps = new Set();
let dirty = false;   // niet-opgeslagen wijzigingen in het geheugen

// ═══════════════════════════════════════════════════════════════════════════
// WOORDENLIJST — kernbegrippen in gewone taal
// ═══════════════════════════════════════════════════════════════════════════
const TERMS = [
  ['NMEA', 'De "taal" waarin boot-instrumenten (gps, windmeter, log, kompas) hun metingen doorsturen. SailingPD luistert naar deze berichten.'],
  ['Polar (snelheidspolar)', 'Een tabel die zegt hoe snel jóuw type boot hóórt te varen bij elke windhoek en windkracht. SailingPD vergelijkt je echte snelheid hiermee — dat wordt je "performance %".'],
  ['Performance %', 'Je snelheid gedeeld door wat de polar mogelijk acht. 100% = precies op schema, minder = er is winst te halen met trim of koers.'],
  ['TWA — ware windhoek', 'De hoek tussen de échte wind en de vaarrichting van de boot.'],
  ['TWS — ware windsnelheid', 'De echte windkracht, los van je eigen vaart.'],
  ['TWD — ware windrichting', 'Uit welke kompasrichting de echte wind komt.'],
  ['AWA / AWS — schijnbaar', 'De wind zoals je hem aan boord vóélt (jouw eigen vaart erbij opgeteld). "Apparent Wind Angle/Speed".'],
  ['VMG', 'Hoeveel je écht opschiet richting de wind (of ervan af) — niet je snelheid door het water, maar je "winst" naar boven of beneden. "Velocity Made Good".'],
  ['SOG', 'Snelheid over de grond, gemeten door de gps. "Speed Over Ground".'],
  ['STW', 'Snelheid door het water, gemeten door de log(meter). "Speed Through Water".'],
  ['Heel / slagzij', 'Hoe ver de boot zijwaarts overhelt.'],
  ['Pitch / stamphoek', 'Hoe ver de boot voor/achter wipt over de golven.'],
  ['Leeway / afdrift', 'De zijwaartse verzetting: de boot vaart iets schuiner dan waar hij naar wijst.'],
  ['Layline', 'De denkbeeldige lijn waarop je in één keer de bovenboei haalt zonder nog over te gaan.'],
  ['Twist', 'De "draai" in het zeil van onder naar boven — een trim-instelling.'],
  ['Pinching', 'Te scherp aan de wind varen (te hoge windhoek), waardoor je snelheid inlevert.'],
  ['UDP / TCP', 'Twee manieren om data over een netwerk te sturen. Instrumenten en multiplexers gebruiken meestal UDP.'],
  ['Baudrate', 'De snelheid van een seriële (kabel-)verbinding. Klassiek NMEA = 4800.'],
  ['Headless', 'Zonder eigen beeldscherm: de computer of Raspberry Pi draait "blind" en je bekijkt alles via de browser.'],
  ['Signal K', 'Een moderne bootdata-server die allerlei instrumentdata verzamelt en kan doorsturen.'],
  ['XDR', 'Een NMEA-bericht met sensor-("transducer")data zoals slagzij en stamphoek. Elk kanaal heeft een label, bijv. ROLL of PTCH.'],
  ['Web-dashboard / webserver', 'SailingPD kan zijn dashboard tonen in een gewone webbrowser. Je opent het op je telefoon, tablet of computer via een webadres (standaard poort 9090).'],
  ['Poort (netwerkpoort)', 'Een genummerd "kanaal" op het netwerk. Twee apps die met elkaar praten moeten dezelfde poort gebruiken. Het web-dashboard staat standaard op 9090.'],
  ['Bind-adres (0.0.0.0)', 'Op welke netwerkverbindingen een server luistert. 0.0.0.0 = op allemaal, dus overal op je netwerk bereikbaar (de gewone keuze).'],
  ['Broadcast (255.255.255.255)', 'Gegevens naar álle apparaten op het netwerk tegelijk sturen, in plaats van naar één specifiek adres.'],
  ['Multiview', 'Een SailingPD-optie om dezelfde gegevens tegelijk naar meerdere losse "repeater"-schermen te sturen. Voor de meeste boten niet nodig.'],
];
function openGlossary() {
  const body = document.getElementById('glossary-body');
  body.innerHTML = TERMS.map(([t, d]) => `
    <div class="border-b border-slate-100 pb-2">
      <div class="font-semibold text-slate-800 text-sm">${t}</div>
      <div class="text-sm text-slate-600">${d}</div>
    </div>`).join('');
  document.getElementById('glossary').classList.remove('hidden');
}
function closeGlossary() { document.getElementById('glossary').classList.add('hidden'); }

// ═══════════════════════════════════════════════════════════════════════════
// TEST NMEA-VERBINDING + sensor-detectie
// ═══════════════════════════════════════════════════════════════════════════
const NMEA_FRIENDLY = {
  RMC:'GPS — positie, snelheid (SOG), koers (COG)', GGA:'GPS — positie', GLL:'GPS — positie',
  VTG:'GPS — koers + snelheid over de grond', ZDA:'GPS — tijd/datum',
  MWV:'Wind — hoek + snelheid', VWR:'Wind — schijnbaar', MWD:'Wind — waar', VWT:'Wind — waar (oud)',
  VHW:'Log — snelheid door het water (STW)', VLW:'Log — afgelegde afstand',
  HDG:'Kompas — koers', HDT:'Kompas — ware koers', HDM:'Kompas — magnetische koers',
  DBT:'Dieptemeter', DPT:'Dieptemeter', MTW:'Watertemperatuur',
  XDR:'Sensoren — o.a. slagzij/stamphoek', ROT:'Draaisnelheid', RSA:'Roerhoek', GSV:'GPS — satellieten',
};
async function testNmea() {
  const channel = document.getElementById('f-channel')?.value || 'network';
  const type = document.getElementById('f-ntype')?.value || 'UDP';
  const ip   = document.getElementById('f-nip')?.value || '';
  const port = document.getElementById('f-nport')?.value || '';
  const out  = document.getElementById('nmea-test-result');
  if (!out) return;
  out.classList.remove('hidden');
  out.innerHTML = '⏳ Luisteren op de verbinding (± 4 seconden)…';
  try {
    const r = await fetch('/api/test-nmea', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ channel, type, ip, port })
    });
    const d = await r.json();
    if (!d.ok) { out.innerHTML = `<span class="text-red-700 font-semibold">✗ ${escHtml(d.error||'Test mislukt')}</span>`; return; }
    if (!d.count) {
      out.innerHTML = `<span class="text-amber-700 font-semibold">⚠️ Verbinding OK, maar géén NMEA-data ontvangen in 4 seconden.</span>
        <div class="text-sm text-slate-600 mt-1">Controleer of je instrumenten aanstaan en of IP/poort klopt${type==='UDP'?' (en of SailingPD niet al op deze poort luistert)':''}.</div>`;
      return;
    }
    const rows = Object.entries(d.types).sort((a,b)=>b[1]-a[1]).map(([t,n]) =>
      `<li>✓ <strong>${escHtml(t)}</strong> <span class="text-slate-500">— ${NMEA_FRIENDLY[t]||'NMEA-bericht'} (${n}×)</span></li>`).join('');
    let xdr = '';
    if (d.xdr_labels && d.xdr_labels.length) {
      xdr = `<div class="mt-3 pt-3 border-t border-slate-200">
        <div class="text-sm font-semibold text-slate-700">🎚️ Bewegingssensor-labels gevonden — automatisch invullen?</div>
        <div class="text-xs text-slate-500 mb-2">Herken je welk label je slagzij (roll) of stamphoek (pitch) is? Klik om het juiste veld te vullen.</div>
        <div class="flex flex-wrap gap-2">` +
        d.xdr_labels.map(l =>
          `<span class="inline-flex items-center gap-1 border border-slate-300 rounded-lg px-2 py-1 text-xs">
             <code class="font-semibold">${escHtml(l)}</code>
             <button type="button" onclick="setXdr('roll','${escHtml(l)}')" class="text-blue-700 hover:underline">→ slagzij</button>
             <span class="text-slate-300">|</span>
             <button type="button" onclick="setXdr('pitch','${escHtml(l)}')" class="text-blue-700 hover:underline">→ stamphoek</button>
           </span>`).join('') +
        `</div></div>`;
    }
    out.innerHTML = `<div class="text-green-800 font-semibold mb-1">✓ ${d.count} NMEA-berichten ontvangen — je verbinding werkt!</div>
      <ul class="text-sm space-y-0.5">${rows}</ul>${xdr}`;
  } catch (e) {
    out.innerHTML = `<span class="text-red-700 font-semibold">✗ ${escHtml(e.message)}</span>`;
  }
}
function setXdr(which, label) {
  const id = which === 'roll' ? 'f-xdroll' : 'f-xdpitch';
  const el = document.getElementById(id);
  if (el) {
    el.value = label;
    el.dispatchEvent(new Event('input'));
    flash(`${which==='roll'?'Slagzij':'Stamphoek'}-sensor ingesteld op "${label}"`, true);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT — load config then render
// ═══════════════════════════════════════════════════════════════════════════
async function boot() {
  const r = await fetch('/api/config');
  const data = await r.json();
  cfg = data;
  document.getElementById('hdr-dir').textContent = data.sailing_dir || '';
  if (data.config_exists) {
    document.getElementById('config-badge').classList.remove('hidden');
  }
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('wizard').classList.remove('hidden');
  document.getElementById('nav-btns').classList.remove('hidden');
  buildNav();
  showStep(0);
}

// ─── helper: get / set nested config ─────────────────────────────────────
function get(section, key, def = '') {
  return (cfg.boatspecifics?.[section]?.[key] ?? def).toString().trim();
}
function getP(section, key, def = '') {
  return (cfg.processlist?.[section]?.[key] ?? def).toString().trim();
}
function getW(section, key, def = '') {
  return (cfg.sendoverwifi?.[section]?.[key] ?? def).toString().trim();
}
function set(section, key, val) {
  if (!cfg.boatspecifics) cfg.boatspecifics = {};
  if (!cfg.boatspecifics[section]) cfg.boatspecifics[section] = {};
  cfg.boatspecifics[section][key] = val;
  dirty = true;
}
function setP(section, key, val) {
  if (!cfg.processlist) cfg.processlist = {};
  if (!cfg.processlist[section]) cfg.processlist[section] = {};
  cfg.processlist[section][key] = val;
  dirty = true;
}
function setW(section, key, val) {
  if (!cfg.sendoverwifi) cfg.sendoverwifi = {};
  if (!cfg.sendoverwifi[section]) cfg.sendoverwifi[section] = {};
  cfg.sendoverwifi[section][key] = val;
  dirty = true;
}
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
function yesno(v) { return v && v.toUpperCase() === 'Y'; }
function yn(bool) { return bool ? 'Y' : 'N'; }

// ─── step metadata ────────────────────────────────────────────────────────
const STEPS = [
  { title: 'Welkom',             icon: '👋', basic: true  },
  { title: 'Activiteit',         icon: '🎯', basic: true  },
  { title: 'Bootgegevens',       icon: '⛵', basic: true  },
  { title: 'NMEA Verbinding',    icon: '🔌', basic: true  },
  { title: 'Snelheidspolar',     icon: '📊', basic: true  },
  { title: 'Correcties',         icon: '🔧', basic: false },
  { title: 'NMEA Uitvoer',       icon: '📡', basic: false },
  { title: 'WiFi & Webserver',   icon: '🌐', basic: true  },
  { title: 'Trim Advies',        icon: '💬', basic: false },
  { title: 'Weergave',           icon: '🖥️', basic: true  },
  { title: 'Webserver Velden',   icon: '📟', basic: false },
  { title: 'Signal K',           icon: '🛰️', basic: false },
  { title: 'Geavanceerd',        icon: '🧰', basic: false },
  { title: 'Opslaan',            icon: '💾', basic: true  },
];
// Basismodus: toon alleen de essentiële stappen. Beginners zien zo 6 i.p.v. 14 stappen.
let basicMode = true;
function visibleIndices() {
  return STEPS.map((_, i) => i).filter(i => !basicMode || STEPS[i].basic);
}
// Volgnummer zoals de gebruiker het ziet: positie binnen de zichtbare stappen (1-based).
function displayNum(i) {
  const p = visibleIndices().indexOf(i);
  return p >= 0 ? p + 1 : i + 1;
}
function visibleCount() { return visibleIndices().length; }
function setBasicMode(v) {
  basicMode = v;
  if (!visibleIndices().includes(currentStep)) currentStep = visibleIndices()[0];
  buildNav();
  showStep(currentStep);
}

function buildNav() {
  const nav = document.getElementById('step-nav');
  const items = STEPS.map((s, i) => {
    if (basicMode && !s.basic) return '';
    const optBadge = s.basic ? '' :
      `<span class="badge badge-opt" style="font-size:.6rem;margin-left:.25rem">optioneel</span>`;
    return `
    <div class="nav-step ${i===currentStep?'active':''}" id="nav-${i}" onclick="showStep(${i})">
      <div class="step-circle step-todo" id="circle-${i}">${displayNum(i)}</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-slate-700">${s.icon} ${s.title}${optBadge}</div>
      </div>
    </div>`;
  }).join('');
  const toggle = basicMode
    ? `<button onclick="setBasicMode(false)" class="w-full text-left text-xs text-blue-600 hover:underline px-2 mt-3">➕ Toon ook de optionele stappen</button>`
    : `<button onclick="setBasicMode(true)" class="w-full text-left text-xs text-slate-500 hover:underline px-2 mt-3">➖ Verberg optionele stappen (basismodus)</button>`;
  nav.innerHTML = items + toggle;
}

function updateNav() {
  STEPS.forEach((_, i) => {
    const navEl    = document.getElementById(`nav-${i}`);
    const circleEl = document.getElementById(`circle-${i}`);
    if (!navEl || !circleEl) return;   // hidden in basismodus
    navEl.classList.toggle('active', i === currentStep);
    const done   = completedSteps.has(i) && i !== currentStep;
    const active = i === currentStep;
    circleEl.className = 'step-circle ' + (done ? 'step-done' : active ? 'step-active' : 'step-todo');
    circleEl.textContent = done ? '✓' : displayNum(i);
  });
  const vis    = visibleIndices();
  const isFirst = currentStep === vis[0];
  const isLast  = currentStep === vis[vis.length - 1];
  document.getElementById('btn-prev').classList.toggle('invisible', isFirst);
  document.getElementById('btn-next').classList.toggle('hidden', isLast);
  document.getElementById('btn-save').classList.toggle('hidden', !isLast);
}

// ═══════════════════════════════════════════════════════════════════════════
// STEP RENDERERS
// ═══════════════════════════════════════════════════════════════════════════
function showStep(i) {
  currentStep = i;
  updateNav();
  const el = document.getElementById('wizard');
  el.innerHTML = stepRenderers[i]();
  // Kaarttitel "Stap N —" gelijktrekken met het dynamische volgnummer
  const h2 = el.querySelector('h2');
  if (h2) h2.innerHTML = h2.innerHTML.replace(/Stap\s+\d+/, 'Stap ' + displayNum(i));
  attachListeners(i);
  window.scrollTo({top:0});
}

function prevStep() {
  const vis = visibleIndices();
  const pos = vis.indexOf(currentStep);
  if (pos > 0) showStep(vis[pos - 1]);
}
function nextStep() {
  const vis = visibleIndices();
  const pos = vis.indexOf(currentStep);
  if (pos < vis.length - 1) {
    completedSteps.add(currentStep);
    showStep(vis[pos + 1]);
  }
}

// ─── UI helpers ───────────────────────────────────────────────────────────
function card(title, body, badge='') {
  return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center gap-3">
      <h2 class="text-lg font-bold text-slate-800">${title}</h2>${badge}
    </div>
    <div class="px-6 py-5">${body}</div>
  </div>`;
}

function why(text) {
  return `<div class="why-box rounded-lg p-4 mb-5 text-sm text-blue-900">${text}</div>`;
}

function warn(text) {
  return `<div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-5 text-sm text-amber-900">⚠️ ${text}</div>`;
}

function textField(id, label, val, hint='', type='text', extra='') {
  return `<div class="field-group">
    <label class="field-label" for="${id}">${label}</label>
    <input class="form-input" id="${id}" type="${type}" value="${escHtml(val)}" ${extra}>
    ${hint ? `<p class="field-hint">${hint}</p>` : ''}
  </div>`;
}

function selectField(id, label, val, options, hint='') {
  const opts = options.map(([v,l]) =>
    `<option value="${v}" ${val===v?'selected':''}>${l}</option>`).join('');
  return `<div class="field-group">
    <label class="field-label" for="${id}">${label}</label>
    <select class="form-input" id="${id}">${opts}</select>
    ${hint ? `<p class="field-hint">${hint}</p>` : ''}
  </div>`;
}

function toggleRow(id, label, checked, hint='') {
  return `<div class="toggle-row">
    <div>
      <div class="toggle-label">${label}</div>
      ${hint ? `<div class="toggle-hint">${hint}</div>` : ''}
    </div>
    <input type="checkbox" id="${id}" ${checked?'checked':''}>
  </div>`;
}

function numField(id, label, val, min, max, step=1, hint='') {
  return `<div class="field-group">
    <label class="field-label" for="${id}">${label}</label>
    <input class="form-input" id="${id}" type="number" value="${val}" min="${min}" max="${max}" step="${step}">
    ${hint ? `<p class="field-hint">${hint}</p>` : ''}
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sectionHeader(text) {
  return `<h3 class="font-semibold text-slate-600 text-sm uppercase tracking-wide mt-6 mb-3 border-b border-slate-100 pb-1">${text}</h3>`;
}

// ─── onChange binding helper ───────────────────────────────────────────────
function bind(id, section, key, transform) {
  const el = document.getElementById(id);
  if (!el) return;
  const t = el.type;
  if (t === 'checkbox') {
    el.addEventListener('change', () => set(section, key, yn(el.checked)));
  } else {
    el.addEventListener('input', () => set(section, key, transform ? transform(el.value) : el.value));
  }
}
function bindP(id, section, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(el.type==='checkbox'?'change':'input', () =>
    setP(section, key, el.type==='checkbox' ? yn(el.checked) : el.value));
}
function bindW(id, section, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(el.type==='checkbox'?'change':'input', () =>
    setW(section, key, el.type==='checkbox' ? yn(el.checked) : el.value));
}

// Eén heldere keuze bovenaan die drie onderliggende instellingen consistent zet:
//   General.activity · Mode.replay · Starting specials.Dummywind
function setActivityMode(mode) {
  if (mode === 'try') {                 // uitproberen zonder instrumenten
    set('General','activity','NMEA'); set('Mode','replay','N'); setP('Starting specials','Dummywind','Y');
  } else if (mode === 'replay') {       // een gelogde tocht naspelen
    set('General','activity','NMEA'); set('Mode','replay','Y'); setP('Starting specials','Dummywind','N');
  } else if (mode === 'analyse') {      // post-processor draaien
    const a = get('General','activity','NMEA');
    set('General','activity', a === 'checkperfwind' ? 'checkperfwind' : 'performancematrix');
    set('Mode','replay','N'); setP('Starting specials','Dummywind','N');
  } else {                              // live zeilen (standaard)
    set('General','activity','NMEA'); set('Mode','replay','N'); setP('Starting specials','Dummywind','N');
  }
  showStep(currentStep);   // opnieuw tekenen zodat waarschuwing/subkeuze meteen verschijnt
}

function currentActivityMode() {
  if (yesno(getP('Starting specials','Dummywind','N'))) return 'try';
  if (yesno(get('Mode','replay','N'))) return 'replay';
  const a = get('General','activity','NMEA');
  if (a === 'performancematrix' || a === 'checkperfwind') return 'analyse';
  return 'live';
}

  const mode = currentActivityMode();
  const act  = get('General','activity','NMEA');

  const modes = [
    { val:'live',   icon:'🌊', label:'Live zeilen',
      desc:'Op het water. SailingPD leest je instrumenten (GPS, wind, log, kompas) en rekent live mee.' },

      desc:'Thuis of aan de wal. SailingPD verzint testwind, zodat je meteen ziet hoe het dashboard werkt — je hebt geen NMEA-bron nodig.' },
    { val:'replay', icon:'🔁', label:'Een gelogde tocht naspelen',
      desc:'Speel een eerder opgeslagen NMEA-logbestand opnieuw af om een tocht achteraf na te bespreken.' },
    { val:'analyse',icon:'📊', label:'Analyse achteraf <span class="badge badge-opt" style="font-size:.65rem">Geavanceerd</span>',
      desc:'Bouw een performance-matrix of bekijk performance per windhoek uit eerder gelogde data.' },
  ];

  const cards = modes.map(m => `
    <label class="flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all
                  ${mode===m.val ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-white hover:border-blue-300'}">
      <input type="radio" name="spdmode" value="${m.val}" ${mode===m.val?'checked':''}

    </label>`).join('');

  const tryHint = (mode === 'try')
    ? `<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-5 text-sm text-emerald-900">
         🧪 SailingPD start straks met <strong>testwind</strong>, dus je ziet het dashboard bewegen zonder dat er
         instrumenten aangesloten zijn. Zet dit terug op <em>Live zeilen</em> zodra je aan boord bent.</div>`

  const replayWarn = (mode === 'replay')
    ? warn(`<strong>Let op:</strong> naspelen werkt alleen met weergavemodus <em>Scherm</em>.
            SailingPD vraagt bij het starten welk logbestand je wilt afspelen, en die vraag kan hij

  const analyseSelect = (mode === 'analyse')
    ? selectField('f-analyse','Welke analyse?', act === 'checkperfwind' ? 'checkperfwind' : 'performancematrix',

        'Beide werken op eerder gelogde PDlog-bestanden (SPDlog CSV). Alleen relevant als je al een tijd data hebt gelogd.')
    : '';

  return card('🎯 Stap 2 — Wat wil je doen?',
    why(`<strong>Waarom dit?</strong> Kies waarvoor je SailingPD nu gebruikt.
         <strong>Live zeilen</strong> is de gewone keuze aan boord. Wil je thuis alvast zien hoe het werkt,
         kies dan <strong>Uitproberen zonder instrumenten</strong> — daarvoor heb je geen NMEA-bron nodig.`) +
    `<div class="space-y-3">${cards}</div>` +
    tryHint + replayWarn + analyseSelect +
    sectionHeader('Gedrag bij opstarten') +
    toggleRow('f-speech-en', 'Spraak ingeschakeld bij start',
      yesno(getP('Starting specials','Speech enabled','N')),
      'Schakelt gesproken trim-adviezen in zodra de app start. Zet dit uit bij de eerste installatie — later aanzetten kan altijd.') +
    toggleRow('f-noquestions', 'Geen vragen bij start (onbeheerd)',
      yesno(getP('Starting specials','Noquestionsasked','N')),
      'Slaat bevestigingsvragen over. Handig als de computer/Pi automatisch opstart bij het aanzetten van de boot.')
  );
}

       <button onclick="saveWebfields()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold">💾 Velden opslaan</button>
     </div>`
  );
}

async function attachWebfieldsListeners() {
  const listEl = document.getElementById('webfields-list');
  if (!listEl) return;
  try {
    const r = await fetch('/api/webserverfields');
    const d = await r.json();
    webfieldsMaster = d.master || [];
    const selected = new Set(d.selected || []);
    listEl.innerHTML = webfieldsMaster.map((kw, i) => `
      <label class="flex items-center gap-2 py-1 text-sm text-slate-700 cursor-pointer">
        <input type="checkbox" class="webfield-cb" value="${escHtml(kw)}" id="wf-${i}"
               ${selected.has(kw) ? 'checked' : ''} onchange="updateWebfieldsCount()">
        <span>${escHtml(kw)}</span>
      </label>`).join('');
    updateWebfieldsCount();
  } catch (e) {
    listEl.innerHTML = `<p class="text-red-600 text-sm col-span-2">Laden mislukt: ${escHtml(e.message)}</p>`;
  }
}

function updateWebfieldsCount() {
  const cbs = document.querySelectorAll('.webfield-cb');
  const on = document.querySelectorAll('.webfield-cb:checked').length;
  const el = document.getElementById('webfields-count');
  if (el) el.textContent = `${on} van ${cbs.length} velden geselecteerd`;
}

function webfieldsSelectAll(state) {
  document.querySelectorAll('.webfield-cb').forEach(cb => { cb.checked = state; });
  updateWebfieldsCount();
}

async function saveWebfields() {
  const selected = Array.from(document.querySelectorAll('.webfield-cb:checked')).map(cb => cb.value);
  const r = await fetch('/api/webserverfields', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({selected})
  });
  const d = await r.json();
  flash(d.success ? `✓ ${d.count} velden opgeslagen` : ('Fout: ' + (d.error || '?')), d.success);
}

async function loadRawFile() {
  const sel = document.getElementById('rawfile-select');
  const ta  = document.getElementById('rawfile-content');
  const btn = document.getElementById('rawfile-save-btn');
  const msg = document.getElementById('rawfile-msg');
  if (!sel || !ta) return;
  const name = sel.value;
  ta.value = 'Laden…';
  try {
    const r = await fetch('/api/rawfile/' + encodeURIComponent(name));
    const d = await r.json();
    ta.value = d.content || '';
    const readonly = !!d.readonly;
    ta.readOnly = readonly;
    ta.style.opacity = readonly ? '0.7' : '1';
    if (btn) btn.disabled = readonly;
    if (btn) btn.classList.toggle('opacity-40', readonly);
    if (btn) btn.classList.toggle('pointer-events-none', readonly);
    if (msg) msg.textContent = readonly ? 'Dit bestand is alleen-lezen.' : (d.exists ? '' : '(bestaat nog niet — opslaan maakt het aan)');
  } catch (e) {
    ta.value = '';
    if (msg) msg.textContent = 'Laden mislukt: ' + e.message;
  }
}

async function saveRawFile() {
  const sel = document.getElementById('rawfile-select');
  const ta  = document.getElementById('rawfile-content');
  const name = sel.value;
  const content = ta.value;
  const r = await fetch('/api/rawfile/' + encodeURIComponent(name), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  });
  const d = await r.json();
  flash(d.success ? '✓ Opgeslagen' : ('Fout: ' + (d.error || '?')), d.success);
}

// LISTENERS — wire form → state
// ═══════════════════════════════════════════════════════════════════════════
function attachListeners(step) {
  if (step === 1) {
    // De moduskeuze (Live / Uitproberen / Naspelen / Analyse) loopt via
    // setActivityMode() in de onchange van de radio's — die zet activity,
    // replay én Dummywind samen. Hier alleen de losse velden koppelen.
    bindP('f-speech-en',  'Starting specials', 'Speech enabled');
    bindP('f-noquestions','Starting specials',  'Noquestionsasked');
    const an = document.getElementById('f-analyse');
    if (an) an.addEventListener('change', () => set('General','activity', an.value));
  }
  if (step === 2) {
    bind('f-boatname',  'Boatdata',  'boat name');
    bind('f-prefspeed', 'Boatdata',  'preferred speed');
    bind('f-windhgt',   'Boatdata',  'windsensor height');
    bind('f-leeway',    'Boatdata',  'leeway K');
    bind('f-color',     'Mode',      'color');
  }
  if (step === 3) {
    const chSel = document.getElementById('f-channel');
    function toggleChannel(v) {
      document.getElementById('section-network').classList.toggle('hidden', v==='serial');
      document.getElementById('section-serial').classList.toggle('hidden', v==='network');
    }
    chSel.addEventListener('change', () => {
      set('NMEAconnection','channel',chSel.value);
      toggleChannel(chSel.value);
    });
    bind('f-ntype',   'NMEAnetwork',   'Type');
    bind('f-nip',     'NMEAnetwork',   'NMEA_IP');
    bind('f-nport',   'NMEAnetwork',   'NMEA_PORT');
    bind('f-sport',   'Serial',        'port');
    bind('f-sbaud',   'Serial',        'speed');
    bind('f-sbits',   'Serial',        'bits');
    bind('f-sparity', 'Serial',        'parity');
    bind('f-sstop',   'Serial',        'stopbits');
    bind('f-awsmul',  'Inputcontrol',  'AWS multiply');
    bind('f-awfilt',  'Inputcontrol',  'AWfilter');
    bind('f-nhz',     'Inputcontrol',  'NMEA Hz');
    bind('f-xdroll',  'Inputcontrol',  'XDR_roll');
    bind('f-xdpitch', 'Inputcontrol',  'XDR_pitch');
  }
  if (step === 5) {
    bind('f-heeldev', 'Inputfiles', 'heeled Dev');
    bind('f-heelstw', 'Inputfiles', 'heeled STW');
  }
  if (step === 6) {
    const sentences = ['MTW','RMB','VTG','GLL','BOD','BWC','BWR','MWV','VHW','VLW','RPM','XDR','NKEP','SMDPRFW','SMDPRFP','MVW','MVP','DIY'];
    sentences.forEach(k => bind(`f-out-${k}`, 'NMEAoutput', k));
    const outfiles = ['SPDlog','NMEAout copy','NMEAin copy','AISin copy'];
    outfiles.forEach(k => bind(`f-ofile-${k.replace(' ','-')}`, 'Outputfiles', k));
    bind('f-soutport',  'Serialout',     'portout');
    bind('f-soutbaud',  'Serialout',     'speedout');
    bind('f-perffilt',  'Outputcontrol', 'perf filter');
    bind('f-genfilt',   'Outputcontrol', 'general filter');
  }
  if (step === 7) {
    const udpCb = document.getElementById('f-udp-on');
    udpCb.addEventListener('change', () => {
      setW('Output','UDPmessages', yn(udpCb.checked));
      document.getElementById('udp-settings').style.opacity = udpCb.checked ? '1':'0.5';
      document.getElementById('udp-settings').style.pointerEvents = udpCb.checked ? '':'none';
    });
    const webCb = document.getElementById('f-web-on');
    webCb.addEventListener('change', () => {
      setW('Output','Webserver', yn(webCb.checked));
      document.getElementById('web-settings').style.opacity = webCb.checked ? '1':'0.5';
      document.getElementById('web-settings').style.pointerEvents = webCb.checked ? '':'none';
    });
    bindW('f-udp-ip',     'Output', 'UDPip');
    bindW('f-udp-port',   'Output', 'UDPport');
    bind('f-udp-interval','Outputcontrol','UDP interval');
    ['layline','perf','wind','current','angles','trimadvice'].forEach(k =>
      bindW(`f-udp-${k}`, 'UDPmessages', k));
    bindW('f-web-ip',   'Output', 'Webservername');
    bindW('f-web-port', 'Output', 'Webserverport');
    bind('f-mv-ip',   'Outputcontrol', 'Multiview_IP');
    bind('f-mv-port', 'Outputcontrol', 'Multiview_PORT');
    loadWebmenuStatus();
  }
  if (step === 8) {
    const advKeys = ['tack perf','big heel','few heel','off course','rudderangle','pinching',
      'too deep','more twist','less twist','outer sheet','perf low','high pitch','shiftmsg','speak advice'];
    advKeys.forEach(k => bind(`f-ta-${k.replace(' ','-')}`, 'Trimadvice', k));
    bind('f-tacktime',  'Trimadvice',    'tack time');
    bind('f-heeldelta', 'Trimadvice',    'heel delta');
    bind('f-offbtw',    'Trimadvice',    'off BTW');
    bind('f-rudderhi',  'Trimadvice',    'rudderanglehigh');
    bind('f-perflim',   'Trimadvice',    'perf limit');
    bind('f-pitchlim',   'Trimadvice',    'pitch limit');
    bind('f-speech',     'Outputcontrol', 'speech interval');
    bindP('f-windshift', 'Thresholds',   'windshift');
    bindP('f-curangle',  'Thresholds',   'currentangle');
    bindP('f-curspeed',  'Thresholds',   'currentspeed');
  }
  if (step === 9) {
    const modeSel = document.getElementById('f-displaymode');
    modeSel.addEventListener('change', () => {
      cfg.display_mode = modeSel.value;
      const screenDiv = document.getElementById('screen-settings');
      screenDiv.className = modeSel.value !== 'screen' ? 'opacity-40 pointer-events-none' : '';
    });
    bindP('f-font',     'Font',     'fonttype');
    bindP('f-fontsize', 'Font',     'fontsize');
    bindP('f-winhor',   'Geometry', 'window-hor');
    bindP('f-winver',   'Geometry', 'window-ver');
  }
  if (step === 10) { attachWebfieldsListeners(); }
  if (step === 12) { attachAdvancedListeners(); }
}

// ─── image upload ─────────────────────────────────────────────────────────
async function uploadImage(name, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const msgEl = document.getElementById(`upload-${name}-msg`);
  msgEl.className = 'text-sm mt-2 text-slate-500';
  msgEl.textContent = '⏳ Bezig met uploaden en omzetten…';
  msgEl.classList.remove('hidden');

  const form = new FormData();
  form.append('file', file);
  try {
    const r = await fetch(`/api/image/${name}`, { method: 'POST', body: form });
    const d = await r.json();
    if (d.success) {
      msgEl.className = 'text-sm mt-2 text-green-700 font-semibold';
      msgEl.textContent = '✓ ' + d.message;
      const preview = document.getElementById(`img-${name}-preview`);
      if (preview) {
        preview.src = `/api/image/${name}?t=${Date.now()}`;
        preview.style.display = '';
        const ph = document.getElementById(`img-${name}-placeholder`);
        if (ph) ph.style.display = 'none';
      }
    } else {
      msgEl.className = 'text-sm mt-2 text-red-700';
      msgEl.textContent = '✗ ' + (d.error || 'Onbekende fout');
    }
  } catch (e) {
    msgEl.className = 'text-sm mt-2 text-red-700';
    msgEl.textContent = '✗ Verbindingsfout: ' + e.message;
  }
  inputEl.value = '';
}

async function previewCsv(folder, filename) {
  const r = await fetch(`/api/csv/${folder}/${encodeURIComponent(filename)}`);
  const d = await r.json();
  const area = document.getElementById('csv-preview-area');
  if (area) {
    area.classList.remove('hidden');
    document.getElementById('csv-preview-content').textContent = d.content;
    document.getElementById('polar-name').value = filename;
    document.getElementById('polar-content').value = d.content;
  }
}

async function previewCsvForEdit(folder) {
  const nameEl = document.getElementById(`name-${folder}`);
  const filename = nameEl?.value;
  if (!filename) { flash('Voer eerst een bestandsnaam in.', false); return; }
  currentCsvFolder = folder;
  currentCsvFile   = filename;
  const r = await fetch(`/api/csv/${folder}/${encodeURIComponent(filename)}`);
  if (!r.ok) {
    document.getElementById('csv-preview-content2').value = '';
  } else {
    const d = await r.json();
    document.getElementById('csv-preview-content2').value = d.content;
  }
  document.getElementById('csv-preview-area2').classList.remove('hidden');
}

async function saveCsvFile(folder) {
  let nameEl = document.getElementById('polar-name') || document.getElementById(`name-${folder}`);
  let contentEl = document.getElementById('polar-content');
  const filename = nameEl?.value?.trim();
  const content  = contentEl?.value ?? '';
  if (!filename) { flash('Voer een bestandsnaam in.', false); return; }
  const r = await fetch(`/api/csv/${folder}/${encodeURIComponent(filename)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  });
  const d = await r.json();
  if (d.success) {
    flash('Bestand opgeslagen!', true);
    const lr = await fetch(`/api/csv/${folder}`);
    const ld = await lr.json();
    if (cfg.files) cfg.files[folder] = ld.files;
  } else {
    flash('Fout: ' + (d.error || 'onbekend'), false);
  }
}

async function saveCsvFromPreview2() {
  const content = document.getElementById('csv-preview-content2').value;
  const folder  = currentCsvFolder;

  if (!folder || !filename) { flash('Geen bestand geselecteerd.', false); return; }
  const r = await fetch(`/api/csv/${folder}/${encodeURIComponent(filename)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  });
  const d = await r.json();
  flash(d.success ? 'Bestand opgeslagen!' : ('Fout: ' + d.error), d.success);
}

async function installWebMenu() {
  const btn = document.getElementById('btn-webmenu');
  if (btn) btn.disabled = true;
  try {
    const d = await (await fetch('/api/webmenu/install', { method:'POST' })).json();
    flash(d.success ? '✓ Dashboard-menu geïnstalleerd' : ('✗ ' + (d.error || '?')), d.success);
  } catch (e) {
    flash('✗ ' + e, false);
  }
  await loadWebmenuStatus();
  if (btn) btn.disabled = false;
}

async function saveAndStart() {
  const r = await fetch('/api/config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      boatspecifics: cfg.boatspecifics,
      processlist:   cfg.processlist,
      sendoverwifi:  cfg.sendoverwifi,
      display_mode:  cfg.display_mode,
    })
  });
  const d = await r.json();
  if (!d.success) {
    flash('✗ Opslaan mislukt: ' + (d.error || '?'), false);
    const res = document.getElementById('save-result');
    if (res) {
      res.classList.remove('hidden');
      res.className = 'save-result bg-red-100 text-red-800 border border-red-300 p-4 rounded-xl font-semibold text-sm mb-4';
      res.textContent = '✗ Opslaan mislukt: ' + (d.error || 'onbekend');
    }
    return;
  }
  dirty = false;
  const r2 = await fetch('/api/start', { method:'POST' });
  const d2 = await r2.json();
  const res = document.getElementById('save-result');
  if (res) {
    res.classList.remove('hidden');
    res.className = `save-result ${d2.success ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-amber-100 text-amber-800 border border-amber-300'} p-4 rounded-xl font-semibold text-sm mb-4`;
    res.textContent = d2.success ? '✓ Configuratie opgeslagen en SailingPD gestart!' : '✓ Configuratie opgeslagen! (Starten: ' + (d2.error || '?') + ')';
  }
  flash(d2.success ? '✓ Gegevens opgeslagen en SailingPD gestart!' : '✓ Gegevens opgeslagen!', d2.success);
}

// ─── flash message ────────────────────────────────────────────────────────
function flash(msg, ok) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = `save-flash ${ok ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}`;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// ═══════════════════════════════════════════════════════════════════════════
boot();
